<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotizacion Promosa</title>
<style>
:root{
  --blue:#0066B4; --blue-dk:#023a66; --blue-soft:#eaf2fb; --green:#0b7a4b; --green-soft:#e7f5ee;
  --gold:#f5c518; --ink:#1a1e24; --muted:#5a646e; --line:#d7dde4; --bg:#eef1f5; --card:#fff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.4}
button,input,textarea,select{font-family:inherit;font-size:14px}
.wrap{display:flex;gap:0;min-height:100vh}
.editor{width:400px;min-width:340px;background:var(--card);border-right:1px solid var(--line);padding:18px 18px 60px;overflow:auto;height:100vh}
.stage{flex:1;overflow:auto;height:100vh;padding:24px;display:flex;justify-content:center;align-items:flex-start}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar h1{font-size:16px;margin:0;color:var(--blue-dk)}
.hint{font-size:12px;color:var(--muted);background:var(--blue-soft);border-radius:8px;padding:8px 10px;margin-bottom:14px;line-height:1.35}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 14px;padding:12px}
legend{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;padding:0 6px}
label{display:block;font-size:11px;color:var(--muted);margin:8px 0 3px;font-weight:600}
input[type=text],input[type=number],input[type=email],textarea,select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fbfcfe;color:var(--ink)}
textarea{resize:vertical;min-height:52px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.prod{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:#fbfcfe;position:relative}
.prod .g{display:grid;grid-template-columns:78px 1fr;gap:6px}
.prod .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.prod .del{position:absolute;top:6px;right:6px;border:none;background:none;color:#c0392b;cursor:pointer;font-weight:700;font-size:15px;line-height:1}
.btn{border:none;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}
.btn-add{background:var(--blue-soft);color:var(--blue);width:100%}
.btn-pdf{background:var(--blue);color:#fff;width:100%;padding:13px;font-size:15px;box-shadow:0 3px 10px rgba(0,102,180,.3)}
.btn-save{background:var(--green);color:#fff;width:100%;margin-top:8px;padding:12px}
.btn-save:disabled{opacity:.6}
#cfg{margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:8px;background:#fbfcfe}
.btn-ghost{background:#f0f2f5;color:var(--muted)}
.actions{position:sticky;bottom:0;background:var(--card);padding:12px 0 0;border-top:1px solid var(--line);margin-top:6px}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--ink)}
.chk input{width:auto}

/* ===== HOJA / COTIZACIÓN ===== */
.sheet{background:#fff;width:816px;min-height:1056px;padding:46px 46px 38px;box-shadow:0 6px 30px rgba(20,30,50,.14);color:#1a1e24}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--blue);padding-bottom:12px}
.sh-head .l{display:flex;gap:12px;align-items:center}
.sh-head img{width:46px;height:auto}
.sh-brand b{font-size:19px;color:var(--blue-dk);display:block;letter-spacing:.2px}
.sh-brand span{font-size:11px;color:var(--muted)}
.sh-cot{border:1px solid var(--line);border-radius:8px;background:#f7fafd;padding:10px 14px;text-align:right;min-width:190px}
.sh-cot .t{color:var(--blue);font-weight:800;font-size:14px;letter-spacing:.04em}
.sh-cot div{font-size:12px;color:#1a1e24;margin-top:2px}
.sh-cot .ok{color:var(--green);font-weight:700}
.greet{margin:16px 0 4px;font-size:15px;font-weight:700}
.greet-sub{font-size:13px;color:#3a4048;margin-bottom:12px}
.hook{display:flex;justify-content:space-between;align-items:center;background:var(--green-soft);border:1px solid #bfe3cf;border-radius:9px;padding:10px 14px;margin:10px 0 14px}
.hook .big{font-size:15px}.hook .big b{font-size:22px;color:var(--green)}
.hook .r{text-align:right;font-size:12px;color:#2b3138}.hook .r b{color:var(--green)}
table.items{width:100%;border-collapse:collapse;margin:6px 0}
table.items th{background:var(--blue);color:#fff;font-size:11px;text-align:left;padding:7px 9px;font-weight:700}
table.items th.n,table.items td.n{text-align:right}
table.items td{padding:8px 9px;border-bottom:1px solid #e6ebf1;font-size:12.5px;vertical-align:top}
table.items td .code{font-size:11px;color:var(--muted)}
.totals{display:flex;justify-content:flex-end;margin-top:8px}
.totals table{border-collapse:collapse;min-width:250px}
.totals td{padding:5px 10px;font-size:13px}
.totals tr.grand td{background:var(--blue-dk);color:#fff;font-weight:800;font-size:15px}
.totals td.n{text-align:right;font-variant-numeric:tabular-nums}
.pay{margin-top:14px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.pay .h{background:#f7fafd;padding:7px 12px;font-weight:700;color:var(--blue-dk);font-size:12.5px;border-bottom:1px solid var(--line)}
.pay ul{margin:0;padding:9px 12px 9px 26px;font-size:12.5px;color:#2b3138}
.pay li{margin:3px 0}
.cta{background:var(--blue);color:#fff;border-radius:9px;padding:14px 16px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.cta .txt b{font-size:15px}.cta .txt p{margin:4px 0 0;font-size:12px;color:#dbeafe;max-width:430px}
.cta .wa{background:#fff;color:var(--blue);border-radius:8px;padding:8px 12px;text-align:center;white-space:nowrap}
.cta .wa b{display:block;font-size:13px}.cta .wa span{font-size:12px;color:#1a1e24;font-weight:700}
.trust{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:8px;margin-top:12px;padding:9px 12px;font-size:11.5px;color:var(--blue-dk);font-weight:700}
.trust span::before{content:"\2713  ";color:var(--green)}
.terms{font-size:10.5px;color:var(--muted);margin-top:12px;line-height:1.4}
.sh-foot{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.sh-foot b{font-size:12.5px}.sh-foot span{font-size:11px;color:var(--muted);display:block}

@media(max-width:900px){.wrap{flex-direction:column}.editor{width:100%;height:auto;border-right:none;border-bottom:1px solid var(--line)}.stage{height:auto}.sheet{width:100%;padding:24px}}

/* ===== IMPRESIÓN → PDF ===== */
@media print{
  @page{size:Letter;margin:12mm}
  body{background:#fff}
  .editor,.no-print{display:none!important}
  .wrap{display:block}
  .stage{padding:0;display:block;height:auto;overflow:visible}
  .sheet{box-shadow:none;width:auto;min-height:0;padding:0}
  .cta{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

var prods=[];
function money(n,dec){dec=(dec===undefined)?2:dec;return "$"+(Number(n)||0).toLocaleString('es-MX',{minimumFractionDigits:dec,maximumFractionDigits:dec});}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function nl2li(t){return String(t||'').split(/\n+/).filter(function(x){return x.trim();}).map(function(x){return '<li>'+esc(x.trim())+'</li>';}).join('');}

function prodRowHTML(i,p){
  return '<div class="prod" data-i="'+i+'">'+
    '<button class="del" title="Quitar">×</button>'+
    '<div class="g"><input type="text" class="pc" placeholder="Código" value="'+esc(p.code)+'">'+
    '<input type="text" class="pd" placeholder="Descripción del producto" value="'+esc(p.desc)+'"></div>'+
    '<div class="g2"><input type="number" class="pq" placeholder="Cant." value="'+esc(p.qty)+'">'+
    '<input type="number" class="pp" placeholder="Precio unitario" value="'+esc(p.price)+'"></div></div>';
}
function renderProds(){
  var host=document.getElementById('prods'); host.innerHTML='';
  prods.forEach(function(p,i){ host.insertAdjacentHTML('beforeend',prodRowHTML(i,p)); });
  host.querySelectorAll('.prod').forEach(function(row){
    var i=+row.getAttribute('data-i');
    row.querySelector('.pc').oninput=function(){prods[i].code=this.value;render();};
    row.querySelector('.pd').oninput=function(){prods[i].desc=this.value;render();};
    row.querySelector('.pq').oninput=function(){prods[i].qty=this.value;render();};
    row.querySelector('.pp').oninput=function(){prods[i].price=this.value;render();};
    row.querySelector('.del').onclick=function(){prods.splice(i,1);renderProds();render();};
  });
}
function val(id){var e=document.getElementById(id);return e?e.value:'';}

function render(){
  var ivaInc=document.getElementById('ivaInc').checked;
  var rows='', base=0;
  prods.forEach(function(p){
    var q=Number(p.qty)||0, pr=Number(p.price)||0, imp=q*pr; base+=imp;
    if(!p.desc && !p.code && !imp) return;
    rows+='<tr><td>'+(p.code?'<span class="code">'+esc(p.code)+'</span><br>':'')+esc(p.desc||'')+'</td>'+
      '<td class="n">'+(q||'')+'</td><td class="n">'+money(pr)+'</td><td class="n">'+money(imp)+'</td></tr>';
  });
  var sub,iva,total;
  if(ivaInc){ total=base; sub=base/1.16; iva=total-sub; }
  else { sub=base; iva=base*0.16; total=base+iva; }

  var hook=val('fin_hook').trim();
  var hookHTML = hook ? '<div class="hook"><div class="big">Desde <b>$'+esc(hook)+'</b> al mes</div>'+
     '<div class="r"><b>Opciones de financiamiento</b><br>arrendamiento a 24 y 36 meses · o a meses con tarjeta</div></div>' : '';

  var planes=nl2li(val('fin_planes'));
  var payHTML = planes ? '<div class="pay"><div class="h">Formas de pago</div><ul>'+planes+'</ul></div>' : '';

  var no=esc(val('f_no')), fecha=esc(val('f_fecha')), vig=esc(val('f_vig'));
  var nom=val('c_nom')||'Cliente';
  var linea2=[val('c_emp'),val('c_dom'),val('c_ciu'),val('c_tel'),val('c_mail')].filter(function(x){return x&&x.trim();}).map(esc).join(' · ');

  document.title='Cotizacion-'+(val('f_no')||'')+'-Promosa';

  var html=''+
  '<div class="sh-head"><div class="l"><img src="'+LOGO+'"><div class="sh-brand"><b>PROMOSA DENTAL</b>'+
    '<span>Distribuidora y depósito dental · 25 años equipando consultorios<br>Dr. Miguel Vera #147, Monterrey, N.L. · '+esc(val('a_tel'))+'</span></div></div>'+
    '<div class="sh-cot"><div class="t">COTIZACIÓN</div><div>No. '+no+'</div><div>'+fecha+'</div><div class="ok">Válida por '+vig+' días</div></div></div>'+
  '<div class="greet">Estimad@ '+esc(nom)+',</div>'+
  '<div class="greet-sub">Con gusto le preparé esta propuesta para equipar su consultorio'+(linea2?' — '+linea2:'')+'.</div>'+
  hookHTML+
  '<table class="items"><thead><tr><th>Descripción</th><th class="n">Cant.</th><th class="n">P. unitario</th><th class="n">Importe</th></tr></thead>'+
    '<tbody>'+(rows||'<tr><td colspan="4" style="color:#8a949e">Agrega productos en el panel izquierdo…</td></tr>')+'</tbody></table>'+
  '<div class="totals"><table>'+
    '<tr><td>Subtotal</td><td class="n">'+money(sub)+'</td></tr>'+
    '<tr><td>IVA (16%)</td><td class="n">'+money(iva)+'</td></tr>'+
    '<tr class="grand"><td>TOTAL</td><td class="n">'+money(total)+'</td></tr></table></div>'+
  payHTML+
  '<div class="cta"><div class="txt"><b>Aparte su equipo y CONGELE su precio</b>'+
    '<p>Responda este correo o escríbame por WhatsApp. Al apartar con enganche, asegura su precio ante el tipo de cambio. Instalación y capacitación incluidas.</p></div>'+
    '<div class="wa">WhatsApp<b>'+esc(val('a_tel'))+'</b><span></span></div></div>'+
  '<div class="trust"><span>+25 años</span><span>Garantía de fábrica</span><span>Proveedores de hospitales</span><span>Envío a todo México</span></div>'+
  '<div class="terms">'+esc(val('a_notas'))+'</div>'+
  '<div class="sh-foot"><b>Su asesor: '+esc(val('a_nom'))+'</b>'+
    '<span>Promosa Dental · '+esc(val('a_tel'))+' · info@promosadental.com · www.promosadental.com</span></div>';
  document.getElementById('sheet').innerHTML=html;
  if(typeof persist==='function'){persist();}
}

/* eventos */
document.getElementById('addProd').onclick=function(){prods.push({code:'',desc:'',qty:1,price:''});renderProds();render();};
document.querySelectorAll('.editor input,.editor textarea').forEach(function(e){
  if(e.closest('#prods'))return; e.addEventListener('input',render);
});
document.getElementById('ivaInc').addEventListener('change',render);

function fechaHoy(){var m=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];var d=new Date();return d.getDate()+' de '+m[d.getMonth()]+' de '+d.getFullYear();}

/* guardar / cargar / nuevo */
var FIELDS=['f_no','f_fecha','f_vig','c_nom','c_emp','c_tel','c_dom','c_ciu','c_mail','fin_hook','fin_planes','a_nom','a_tel','a_notas'];
function persist(){
  try{var d={f:{},p:prods,iva:document.getElementById('ivaInc').checked};FIELDS.forEach(function(k){d.f[k]=val(k);});localStorage.setItem('cotiPromosa',JSON.stringify(d));}catch(e){}
}
/* ---- Google Sheets ---- */
var cfg=document.getElementById('cfg'), sheetUrlEl=document.getElementById('sheetUrl');
try{sheetUrlEl.value=localStorage.getItem('cotiSheetUrl')||sheetUrlEl.value||'';}catch(e){}
document.getElementById('cfgBtn').onclick=function(){cfg.hidden=!cfg.hidden;};
sheetUrlEl.addEventListener('input',function(){try{localStorage.setItem('cotiSheetUrl',sheetUrlEl.value.trim());}catch(e){}});
function collectPayload(){
  var ivaInc=document.getElementById('ivaInc').checked,base=0,items=[];
  prods.forEach(function(p){var q=Number(p.qty)||0,pr=Number(p.price)||0,imp=q*pr;base+=imp;if(p.desc||p.code||imp)items.push({codigo:p.code,descripcion:p.desc,cantidad:q,precio:pr,importe:imp});});
  var total=ivaInc?base:base*1.16;
  return {no:val('f_no'),fecha:val('f_fecha'),nombre:val('c_nom'),empresa:val('c_emp'),telefono:val('c_tel'),email:val('c_mail'),ciudad:val('c_ciu'),domicilio:val('c_dom'),productos:items,total:Math.round(total*100)/100,planes:val('fin_planes').replace(/\n+/g,' | '),asesor:val('a_nom')};
}
document.getElementById('saveSheet').onclick=function(){
  var url=(sheetUrlEl.value||'').trim(), msg=document.getElementById('saveMsg'), btn=this;
  if(!url){cfg.hidden=false;msg.style.color='#c0392b';msg.textContent='Primero pega la URL de Google Sheets en "⚙️ Conectar Sheets".';return;}
  if(!prods.some(function(p){return (Number(p.qty)||0)*(Number(p.price)||0)>0;})){msg.style.color='#c0392b';msg.textContent='Agrega al menos un producto con precio antes de guardar.';return;}
  btn.disabled=true;btn.textContent='Guardando…';
  fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(collectPayload())})
   .then(function(){msg.style.color='#0b7a4b';msg.textContent='✓ Cotización '+val('f_no')+' guardada en Google Sheets.';})
   .catch(function(){msg.style.color='#c0392b';msg.textContent='No se pudo guardar. Revisa la URL de Sheets o tu conexión.';})
   .finally(function(){btn.disabled=false;btn.textContent='💾 Guardar cotización en Google Sheets';});
};
document.getElementById('newBtn').onclick=function(){
  if(!confirm('¿Vaciar todo para una cotización nueva?'))return;
  FIELDS.forEach(function(k){if(k!=='a_nom'&&k!=='a_tel'&&k!=='a_notas'&&k!=='f_vig'&&k!=='fin_planes')document.getElementById(k).value='';});
  document.getElementById('f_fecha').value=fechaHoy();
  prods=[{code:'',desc:'',qty:1,price:''}];renderProds();render();
};

function boot(){
  var loaded=false;
  try{var raw=localStorage.getItem('cotiPromosa');if(raw){var d=JSON.parse(raw);FIELDS.forEach(function(k){if(d.f&&d.f[k]!=null)document.getElementById(k).value=d.f[k];});if(d.p&&d.p.length)prods=d.p;document.getElementById('ivaInc').checked=(d.iva!==false);loaded=true;}}catch(e){}
  if(!document.getElementById('f_fecha').value)document.getElementById('f_fecha').value=fechaHoy();
  if(!loaded){
    prods=[
      {code:'ALF-UH6',desc:'Unidad eléctrica modelo H6 c/lámpara 4 leds marca Alfa',qty:1,price:41900},
      {code:'INT-LH3300',desc:'Unidad dental modelo LH3300 c/reflector LED Toletek (OFERTA)',qty:1,price:41900},
      {code:'ZED-UDZD3',desc:'Unidad eléctrica modelo Galaxy ZD3 marca Zedent (OFERTA)',qty:1,price:45900}
    ];
  }
  renderProds();render();
}
boot();
</script>
